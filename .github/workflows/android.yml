name: Build Tartaros Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web game
        run: npm run build

      - name: Initialize Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Android landscape orientation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          pattern = r'(<activity\\b[^>]*android:name="[^"]*MainActivity"[^>]*)'
          if re.search(pattern, text):
              text = re.sub(
                  pattern,
                  lambda m: m.group(1) if 'android:screenOrientation=' in m.group(1)
                  else m.group(1) + ' android:screenOrientation="landscape"',
                  text,
                  count=1
              )
          else:
              # Capacitor's generated manifest normally has MainActivity.
              # If its formatting changes, fail instead of producing an unlocked APK.
              raise SystemExit("MainActivity was not found in AndroidManifest.xml")

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tartaros-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
