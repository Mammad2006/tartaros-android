name: Build Tartaros Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web game
        env:
          VITE_GAME_SERVER_URL: ${{ secrets.VITE_GAME_SERVER_URL }}
        run: npm run build

      - name: Initialize Capacitor Android
        run: npx cap add android

      - name: Install Pillow for Android icon generation
        run: python3 -m pip install --quiet Pillow

      - name: Generate Tartaros Android launcher icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('resources/icon.png')
          if not source.exists():
              raise SystemExit('resources/icon.png was not found')

          img = Image.open(source).convert('RGBA')
          sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }

          for density, size in sizes.items():
              out = Path(f'android/app/src/main/res/mipmap-{density}')
              out.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(out / 'ic_launcher.png', optimize=True)
              icon.save(out / 'ic_launcher_round.png', optimize=True)
          print('Tartaros launcher icons generated.')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Enable immersive full-screen Android mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          activity = Path('android/app/src/main/java/com/tartaros/game/MainActivity.java')
          if not activity.exists():
              candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
              if not candidates:
                  raise SystemExit('MainActivity.java was not found')
              activity = candidates[0]

          text = activity.read_text(encoding='utf-8')
          pkg = re.search(r'^package\s+([\w.]+);', text, re.MULTILINE)
          if not pkg:
              raise SystemExit('Could not determine Android package name')
          package_name = pkg.group(1)

          new_text = '''package __PACKAGE__;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  Window window = getWindow();
                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      WindowInsetsController controller = window.getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                      }
                  } else {
                      window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN);
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          '''.replace('__PACKAGE__', package_name)

          # Remove the indentation inherited from the YAML block.
          new_text = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_text.splitlines()) + '\n'
          activity.write_text(new_text, encoding='utf-8')
          print(f'Immersive full-screen enabled in {activity}')
          PY

      - name: Force Android landscape orientation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not found")

          text = manifest.read_text(encoding="utf-8")

          # Find MainActivity regardless of attribute order.
          pattern = r'(<activity\b[^>]*\bandroid:name="[^"]*MainActivity"[^>]*)'
          match = re.search(pattern, text)

          if not match:
              # Fallback for .MainActivity / fully-qualified MainActivity.
              pattern = r'(<activity\b[^>]*android:name="[^"]*\.?MainActivity"[^>]*)'
              match = re.search(pattern, text)

          if not match:
              # Final fallback: find the launcher activity.
              launcher_pattern = (
                  r'(<activity\b(?=[^>]*android.intent.action.MAIN)'
                  r'(?=[^>]*android.intent.category.LAUNCHER)[^>]*)'
              )
              match = re.search(launcher_pattern, text)

          if not match:
              raise SystemExit(
                  "Could not find MainActivity or launcher activity"
              )

          activity_tag = match.group(1)

          if 'android:screenOrientation=' not in activity_tag:
              new_activity_tag = (
                  activity_tag +
                  ' android:screenOrientation="landscape"'
              )

              text = (
                  text[:match.start(1)] +
                  new_activity_tag +
                  text[match.end(1):]
              )
          else:
              text = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="landscape"',
                  text,
                  count=1
              )

          manifest.write_text(text, encoding="utf-8")

          print("Android landscape orientation enabled successfully.")
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tartaros-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error