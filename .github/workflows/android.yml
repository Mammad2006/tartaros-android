name: Build Tartaros Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web game
        run: npm run build

      - name: Initialize Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Android landscape orientation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not found")

          text = manifest.read_text(encoding="utf-8")

          # Find MainActivity regardless of attribute order.
          pattern = r'(<activity\b[^>]*\bandroid:name="[^"]*MainActivity"[^>]*)'
          match = re.search(pattern, text)

          if not match:
              # Fallback for .MainActivity / fully-qualified MainActivity.
              pattern = r'(<activity\b[^>]*android:name="[^"]*\.?MainActivity"[^>]*)'
              match = re.search(pattern, text)

          if not match:
              # Final fallback: find the launcher activity.
              launcher_pattern = (
                  r'(<activity\b(?=[^>]*android.intent.action.MAIN)'
                  r'(?=[^>]*android.intent.category.LAUNCHER)[^>]*)'
              )
              match = re.search(launcher_pattern, text)

          if not match:
              raise SystemExit(
                  "Could not find MainActivity or launcher activity"
              )

          activity_tag = match.group(1)

          if 'android:screenOrientation=' not in activity_tag:
              new_activity_tag = (
                  activity_tag +
                  ' android:screenOrientation="landscape"'
              )

              text = (
                  text[:match.start(1)] +
                  new_activity_tag +
                  text[match.end(1):]
              )
          else:
              text = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="landscape"',
                  text,
                  count=1
              )

          manifest.write_text(text, encoding="utf-8")

          print("Android landscape orientation enabled successfully.")
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tartaros-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error